name: MLflow CI Workflow

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  train-and-build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow==2.19.0 pandas scikit-learn python-dotenv numpy matplotlib seaborn joblib virtualenv

      - name: Run MLflow Project
        run: |
          cd MLProject
          # Run MLflow project
          mlflow run . --env-manager local

      - name: Save Artifacts to GitHub Actions
        uses: actions/upload-artifact@v3
        with:
          name: mlruns-artifacts
          path: MLProject/mlruns/

      - name: Build Docker Image
        run: |
          cd MLProject
          # Get the latest run ID from the experiment
          export RUN_ID=$(python -c "import mlflow; runs = mlflow.search_runs(experiment_names=['MSML_Basic_Breast_Cancer']); print(runs.iloc[0].run_id)")
          echo "Building Docker image for run ID: $RUN_ID"
          
          # Build Docker image using mlflow build-docker
          mlflow models build-docker -m "runs:/$RUN_ID/model" -n 0ryzal/msml-model:latest
          
          # Note: To push to Docker Hub, you would normally run:
          # echo "${{ secrets.DOCKER_HUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin
          # docker push 0ryzal/msml-model:latest
